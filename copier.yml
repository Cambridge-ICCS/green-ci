source_file_paths:
  type: yaml
  default: ['**/*.py']
  multiline: true
  help: |
    A YAML list of source file patterns including the file extension.
    Example:
      - '**/*.py'

docs_file_paths:
  type: yaml
  default: ['**/*.md']
  multiline: true
  help: |
    A YAML list of documentation file patterns including the file extension.
    Example:
      - '**/*.md'

build_docs_timeout:
  type: int
  default: 15
  help: The timeout in minutes for the documentation build job

static_analysis_timeout:
  type: int
  default: 10
  help: The timeout in minutes for the static analysis job

deploy_docs:
  type: bool
  default: true
  help: Whether to include a deployment job in the docs workflow.

carbon_aware:
  type: bool
  default: true
  help: Whether to include carbon-aware energy measurement steps in the workflow

_subdirectory: "template"
